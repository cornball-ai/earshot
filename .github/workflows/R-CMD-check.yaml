name: R-CMD-check

on:
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  # Actions provisions this for every run, no secret to rotate.
  # Anonymous API access is rate-limited per runner IP, so a public
  # repo still needs a token to fetch reliably -- just not a personal
  # one that can expire.
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: |
          Rscript -e '
          # glinty and stt.api are not on CRAN, and both are public,
          # so no token is involved.
          remotes::install_github(c("cornball-ai/glinty", "cornball-ai/stt.api"),
                                  dependencies = TRUE, upgrade = "never")
          remotes::install_deps(".", dependencies = TRUE, upgrade = "never")
          '

      - name: Test
        run: ./run.sh run_tests
